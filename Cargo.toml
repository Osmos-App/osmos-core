[workspace]
members = [
    "crates/osmos-core",
    "crates/osmos-daemon",
    "crates/osmos-transport",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Osmos Team"]
license     = "MIT"

[workspace.dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["codec"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Storage
rusqlite    = { version = "0.31", features = ["bundled"] }

# Hashing
blake3      = "1"

# IDs
uuid        = { version = "1", features = ["v4", "serde"] }

# Time
chrono      = { version = "0.4", features = ["serde"] }

# Error handling
thiserror   = "1"
anyhow      = "1"

# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# Filesystem walk
walkdir     = "2"

# Home directory resolution
dirs        = "5"

# P2P
mdns-sd     = "0.11"
quinn       = "0.11"
rustls      = { version = "0.23", features = ["ring"] }
rcgen       = "0.13"
